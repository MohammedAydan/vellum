<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vellum administration console." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b1120" />
    <title>VELLUM — Platform Owner Admin Console</title>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased selection:bg-rose-500/20">
    <div id="root" data-splash><div class="vl-splash" role="status" aria-live="polite" aria-label="Loading"><div class="vl-spin"></div><span>VELLUM</span></div></div>
    <noscript>VELLUM needs JavaScript to run. <a href="/">Back to the home page</a>.</noscript>
    <style>
      html{background:#0b1120}
      @media (prefers-color-scheme: light){html{background:#fafbfc}.vl-splash{color:#5b6575}}
      .vl-splash{min-height:100vh;display:flex;flex-direction:column;gap:.9rem;align-items:center;justify-content:center;font:600 13px/1 system-ui,sans-serif;letter-spacing:.2em;color:#9aa4b5}
      .vl-spin{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:vl-r .8s linear infinite}
      @keyframes vl-r{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.vl-spin{animation:none;border-top-color:currentColor;opacity:.6}}
    </style>
    <!--
      Runtime API base override. A host page may inject
      <meta name="vellum:api-base-url" content="https://api.example.com"> before
      this script runs; copy it to the global the app reads. Never blocks render
      and performs no fetch — an unreachable API still yields a normal UI with
      an error state.
    -->
    <script>
      (function () {
        try {
          var meta = document.querySelector('meta[name="vellum:api-base-url"]');
          var value = meta && meta.getAttribute("content");
          if (value && value.trim() && !window.__VELLUM_API_BASE_URL__) {
            window.__VELLUM_API_BASE_URL__ = value.trim();
          }
        } catch (_) {
          /* bootstrap must never prevent the app from loading */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
