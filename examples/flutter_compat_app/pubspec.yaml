name: flutter_compat_app
description: Minimal Flutter app used by CI to build and test vellum_flutter on web, Android, iOS and desktop.
publish_to: none
version: 0.0.2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  vellum_flutter:
    path: ../../sdks/flutter
  vellum_flutter_secure_storage:
    path: ../../sdks/flutter_secure_storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
