name: vellum_flutter_secure_storage
description: Persistent, encrypted session storage for vellum_flutter (Keychain, Keystore, libsecret, Windows Credential, WebCrypto). Add it and sessions survive restarts, with no code and no native setup.
version: 0.0.3
publish_to: none # switch to hosted vellum_flutter before the first publish
homepage: https://github.com/MohammedAydan/vellum
repository: https://github.com/MohammedAydan/vellum/tree/main/sdks/flutter_secure_storage
issue_tracker: https://github.com/MohammedAydan/vellum/issues
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  vellum_flutter:
    path: ../flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: VellumSecureStoragePlugin
      ios:
        dartPluginClass: VellumSecureStoragePlugin
      linux:
        dartPluginClass: VellumSecureStoragePlugin
      macos:
        dartPluginClass: VellumSecureStoragePlugin
      windows:
        dartPluginClass: VellumSecureStoragePlugin
      web:
        pluginClass: VellumSecureStorageWebPlugin
        fileName: src/web_registration.dart
