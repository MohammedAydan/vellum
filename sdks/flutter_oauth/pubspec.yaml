name: vellum_flutter_oauth
description: Google and GitHub sign-in for vellum_flutter. Secure system-browser flow (code + PKCE) on iOS, Android, macOS, Windows, Linux and web, plus an optional native Google path.
version: 0.0.2
publish_to: none # switch to hosted vellum_flutter before the first publish
homepage: https://github.com/MohammedAydan/vellum
repository: https://github.com/MohammedAydan/vellum/tree/main/sdks/flutter_oauth
issue_tracker: https://github.com/MohammedAydan/vellum/issues
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_auth_2: ^6.1.0
  google_sign_in: ^7.2.0
  vellum_flutter:
    path: ../flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
