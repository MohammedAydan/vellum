name: vellum_flutter
description: Official Flutter SDK for VELLUM. Encrypted persistent sessions, Google and GitHub sign-in, reactive auth, OCC transactions, typed models and realtime streams.
version: 0.0.3
homepage: https://github.com/MohammedAydan/vellum
repository: https://github.com/MohammedAydan/vellum/tree/main/sdks/flutter
issue_tracker: https://github.com/MohammedAydan/vellum/issues
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  crypto: ^3.0.3
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  app_links: ^7.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  http: ^1.3.0
  stream_channel: ^2.1.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: VellumSecureStoragePlugin
      ios:
        dartPluginClass: VellumSecureStoragePlugin
      linux:
        dartPluginClass: VellumSecureStoragePlugin
      macos:
        dartPluginClass: VellumSecureStoragePlugin
      windows:
        dartPluginClass: VellumSecureStoragePlugin
      web:
        pluginClass: VellumSecureStorageWebPlugin
        fileName: src/secure_storage/web_registration.dart
