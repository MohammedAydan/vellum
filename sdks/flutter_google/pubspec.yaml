name: vellum_flutter_google
description: Optional native Google sign-in (google_sign_in) for vellum_flutter. Google and GitHub browser sign-in already ships inside vellum_flutter.
version: 0.0.3
publish_to: none # optional companion; not published with 0.0.3
homepage: https://github.com/MohammedAydan/vellum
repository: https://github.com/MohammedAydan/vellum/tree/main/sdks/flutter_oauth
issue_tracker: https://github.com/MohammedAydan/vellum/issues
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  vellum_flutter:
    path: ../flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
