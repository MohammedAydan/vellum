# Production stack: API (:8080) + unified frontend gateway (:3000) + Caddy (80/443).
# Usage: VELLUM_DOMAIN=example.com docker compose -f deploy/docker/docker-compose.prod.yml up -d --build
# VELLUM_REPO_ROOT defaults to ../.. (the repository root, relative to this file).
# Relative bind-mount paths are resolved from this file's directory, hence the
# ${VELLUM_REPO_ROOT:-../..} prefix on the Caddyfile and .env.
# Zero-Redis doctrine: PostgreSQL is external (Neon/Postgres) via
# CONTROL_DATABASE_URL / DATA_DATABASE_URL in .env — no cache or broker service.

services:
  api:
    build:
      context: ${VELLUM_REPO_ROOT:-../..}
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${VELLUM_REPO_ROOT:-../..}/.env
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/v1/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ${VELLUM_REPO_ROOT:-../..}
      dockerfile: deploy/docker/Dockerfile.frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "3000"
      API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # VELLUM_DOMAIN is required: the apex domain Caddy serves, e.g. example.com.
      VELLUM_DOMAIN: ${VELLUM_DOMAIN:?set VELLUM_DOMAIN to your apex domain, e.g. example.com}
    volumes:
      - ${VELLUM_REPO_ROOT:-../..}/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
