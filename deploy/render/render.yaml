# API-only one-click deploy. The service listens on port 8080 (API_PORT);
# Render also injects PORT, so both are pinned to 8080 below.
# Secrets use `sync: false` — set them in the Render dashboard, never here.
services:
  - type: web
    name: vellum-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm --filter @vellum/api build
    startCommand: node apps/api/dist/node-server.js
    healthCheckPath: /v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: API_PORT
        value: 8080
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_MODE
        value: postgres
      # External Neon/Postgres URLs — supply in the Render dashboard.
      - key: CONTROL_DATABASE_URL
        sync: false
      - key: DATA_DATABASE_URL
        sync: false
      # Distinct realm secrets plus the other required production secrets.
      - key: CONSOLE_JWT_SECRET
        sync: false
      - key: SUPER_ADMIN_JWT_SECRET
        sync: false
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_KEY_PEPPER
        sync: false
      - key: CURSOR_HMAC_SECRET
        sync: false
      - key: SESSION_COOKIE_SECRET
        sync: false
      # Comma-separated allowed browser origins. The API reads
      # CORS_ALLOWED_ORIGINS; CORS_ORIGINS is kept for hosting-config parity.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
