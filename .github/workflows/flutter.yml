name: Flutter

on:
  pull_request:
    branches: [main]
    paths:
      - "sdks/flutter/**"
      - "examples/flutter_compat_app/**"
      - ".github/workflows/flutter.yml"
  push:
    branches: [main]
    paths:
      - "sdks/flutter/**"
      - "examples/flutter_compat_app/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-web:
    name: Dart SDK in Chrome (real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: sdks/flutter
      - name: Run all browser-compatible tests in Chrome
        run: flutter test --platform chrome test/web
        working-directory: sdks/flutter

  app-test:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
        working-directory: examples/flutter_compat_app
      - run: flutter analyze
        working-directory: examples/flutter_compat_app
      - run: flutter test
        working-directory: examples/flutter_compat_app

  sdk-package:
    name: vellum_flutter package (analyze + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: sdks/flutter
      - run: flutter analyze --fatal-infos
        working-directory: sdks/flutter
      - run: flutter test
        working-directory: sdks/flutter
      - name: Dart formatting must be clean (pub.dev static analysis points)
        working-directory: sdks/flutter
        run: |
          dart format --output=none --set-exit-if-changed . || {
            dart format .
            git diff > /tmp/format.patch
            echo "Files need formatting; patch uploaded as an artifact."
            exit 1
          }
      - name: Upload format patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dart-format-patch
          path: /tmp/format.patch
          if-no-files-found: ignore
      - name: pub.dev score (pana) must be 160/160
        working-directory: sdks/flutter
        run: |
          dart pub global activate pana
          export PATH="$PATH:$HOME/.pub-cache/bin"
          pana --no-warning --json . > /tmp/pana.json
          jq '{granted: .scores.grantedPoints, max: .scores.maxPoints}' /tmp/pana.json
          jq -r '.report.sections[] | select(.grantedPoints < .maxPoints) | "\(.title): \(.grantedPoints)/\(.maxPoints)\n\(.summary)"' /tmp/pana.json
          test "$(jq .scores.grantedPoints /tmp/pana.json)" = "$(jq .scores.maxPoints /tmp/pana.json)"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, os: ubuntu-latest, platform: web, cmd: "flutter build web --release" }
          - { target: android-apk, os: ubuntu-latest, platform: android, cmd: "flutter build apk --debug" }
          - { target: linux, os: ubuntu-latest, platform: linux, cmd: "flutter build linux --debug" }
          - { target: ios-no-codesign, os: macos-latest, platform: ios, cmd: "flutter build ios --debug --no-codesign" }
          - { target: macos, os: macos-latest, platform: macos, cmd: "flutter build macos --debug" }
          - { target: windows, os: windows-latest, platform: windows, cmd: "flutter build windows --debug" }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - name: Generate the ${{ matrix.platform }} runner (not committed)
        shell: bash
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop >/dev/null 2>&1 || true
          flutter create --platforms=${{ matrix.platform }} --project-name flutter_compat_app --org dev.vellum.compat "$RUNNER_TEMP/scaffold"
          cp -R "$RUNNER_TEMP/scaffold/${{ matrix.platform }}" examples/flutter_compat_app/
      - run: flutter pub get
        working-directory: examples/flutter_compat_app
      - name: Build
        shell: bash
        run: ${{ matrix.cmd }}
        working-directory: examples/flutter_compat_app
